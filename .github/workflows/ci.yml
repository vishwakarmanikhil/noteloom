name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    # Lint + format + bundle-size budget. One Node version — these don't vary
    # across the engines range. See docs/repackaging-plan.md Phase 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run size

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Verifies the "engines": ">=18" claim in package.json actually
        # holds, not just on whatever version happens to be installed
        # locally -- matches the newest LTS (20) too since that's the
        # publish workflow's own runtime, plus the latest release (22).
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  e2e:
    # Playwright e2e: the comments flow + the golden-document regression gate
    # (deterministic fixture whose serialized output is snapshotted — see
    # docs/repackaging-plan.md). One Node version is enough; this guards
    # rendering/serialization behavior, not the engines range.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
